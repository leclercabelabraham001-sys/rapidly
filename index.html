<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Désactivation automatique du cache pour que chaque mise à jour GitHub soit immédiate -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>RAPIDLY Sénégal - VTC, Livraison & Fret</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rapidlyRed: '#E50914',
                        rapidlyRedDark: '#C00711',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #F8F9FA;
            color: #111827;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: manipulation;
            user-select: none;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
            background-color: #E5E7EB;
            z-index: 1;
        }
        .leaflet-control-zoom, .leaflet-control-attribution { display: none !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .shadow-yango { box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04); }
        .shadow-card { box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05); }

        @keyframes gps-pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.75); }
            70% { box-shadow: 0 0 0 14px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .gps-user-dot {
            animation: gps-pulse 2s infinite;
            border-radius: 50%;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 antialiased">

    <div class="max-w-md mx-auto h-screen bg-gray-100 flex flex-col relative shadow-2xl overflow-hidden border-x border-gray-200">
        
        <!-- HEADER BLANC ÉPURÉ -->
        <header class="absolute top-0 left-0 right-0 p-4 z-30 flex justify-between items-center pointer-events-none">
            <button onclick="openProfileModal()" class="pointer-events-auto w-11 h-11 bg-white/95 backdrop-blur-md rounded-2xl border border-gray-200 flex items-center justify-center shadow-yango active:scale-95 transition" title="Mon Profil">
                <svg class="w-5 h-5 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            </button>

            <!-- Logo Officiel RAPIDLY -->
            <div class="pointer-events-auto flex items-center gap-2 bg-white/95 backdrop-blur-md p-1.5 px-3.5 rounded-2xl border border-gray-200 shadow-yango">
                <div class="w-7 h-7 rounded-lg bg-rapidlyRed flex items-center justify-center p-1 shrink-0 shadow-sm">
                    <svg viewBox="0 0 100 100" class="w-full h-full">
                        <path d="M 22,12 L 58,12 C 78,12 88,23 88,38 C 88,50 78,60 62,61 L 88,88 L 66,88 L 44,62 L 40,62 L 40,88 L 22,88 Z M 40,30 L 40,46 L 55,46 C 64,46 70,42 70,38 C 70,33 64,30 55,30 Z" fill="#FFFFFF" />
                    </svg>
                </div>
                <span class="font-black text-sm tracking-tight text-gray-900">RAPIDLY</span>
                <span class="bg-rapidlyRed/10 text-rapidlyRed text-[9px] px-1.5 py-0.5 rounded font-black">SN</span>
            </div>

            <!-- Switch Passager / Chauffeur -->
            <button id="modeToggleBtn" onclick="toggleUserRole()" class="pointer-events-auto bg-rapidlyRed hover:bg-rapidlyRedDark active:scale-95 text-white text-xs px-3.5 py-2.5 rounded-2xl font-bold shadow-yango transition flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
                <span id="modeBtnText">Mode Chauffeur</span>
            </button>
        </header>

        <!-- CARTE CLAIRE INTERACTIVE -->
        <div class="relative w-full flex-1">
            <div id="map"></div>

            <!-- BADGE STATUT POSITION GPS ACTUELLE -->
            <div id="gpsStatusPill" class="absolute top-20 left-4 right-4 z-20 bg-white/95 backdrop-blur-md p-2.5 px-3.5 rounded-2xl border border-gray-200 flex justify-between items-center text-gray-900 shadow-yango transition-all">
                <div class="flex items-center gap-2 truncate pr-2">
                    <span id="gpsDotIndicator" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping shrink-0"></span>
                    <span id="gpsAddressLabel" class="truncate font-bold text-xs text-gray-800">Localisation GPS en cours...</span>
                </div>
                <span id="gpsBadgeTag" class="text-[10px] font-extrabold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full shrink-0">GPS LIVE</span>
            </div>

            <!-- BANDEAU TRAJET DYNAMIQUE (Quand destination choisie) -->
            <div id="mapRouteBadge" class="hidden absolute top-20 left-4 right-4 z-20 bg-white/95 backdrop-blur-md p-3 rounded-2xl border border-gray-200 justify-between items-center text-gray-900 shadow-yango transition-all">
                <div class="flex items-center gap-2 truncate pr-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0"></span>
                    <span id="routeBadgeText" class="truncate font-bold text-xs text-gray-800">Départ ➔ Destination</span>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                    <span id="routeDistanceText" class="font-extrabold text-xs text-rapidlyRed bg-rapidlyRed/10 px-2 py-0.5 rounded-full">0 km</span>
                    <span id="routeTimeText" class="text-gray-500 font-semibold text-[11px]">0 min</span>
                </div>
            </div>

            <!-- Bouton Recentrer GPS Réel -->
            <button onclick="locateUserExactPosition(true)" title="Ma position exacte" class="absolute right-4 bottom-80 z-20 w-11 h-11 bg-white/95 backdrop-blur-md rounded-2xl border border-gray-200 flex items-center justify-center text-gray-800 shadow-yango active:scale-95 transition">
                <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </button>
        </div>

        <!-- 1. PAGE D'ACCUEIL PASSAGER -->
        <div id="homeSheet" class="absolute bottom-0 left-0 right-0 z-20 bg-white rounded-t-3xl p-5 flex flex-col gap-4 shadow-yango border-t border-gray-200">
            <div class="w-12 h-1 bg-gray-200 rounded-full mx-auto -mt-1"></div>

            <!-- Barre "Où allez-vous ?" -->
            <div onclick="openOrderModal('ville')" class="bg-gray-50 hover:bg-gray-100 border border-gray-200 p-4 rounded-2xl flex items-center justify-between cursor-pointer active:scale-98 transition shadow-card">
                <div class="flex items-center gap-3.5">
                    <div class="w-3.5 h-3.5 rounded-full bg-rapidlyRed ring-4 ring-rapidlyRed/20"></div>
                    <div>
                        <span class="text-sm font-extrabold text-gray-900 block">Où allez-vous ?</span>
                        <span id="homeCurrentPosSub" class="text-xs text-gray-500 font-medium">Départ depuis votre position actuelle...</span>
                    </div>
                </div>
                <div class="bg-white p-2 rounded-xl shadow-sm border border-gray-100">
                    <svg class="w-4 h-4 text-rapidlyRed" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>
            </div>

            <!-- GRILLE 4 SERVICES -->
            <div class="grid grid-cols-4 gap-2.5">
                <!-- Ville (VTC Voiture) -->
                <div onclick="openOrderModal('ville')" class="bg-gray-50 border border-gray-200 hover:border-rapidlyRed/40 p-3 rounded-2xl flex flex-col items-center gap-1.5 cursor-pointer active:scale-95 transition text-center shadow-card group">
                    <div class="w-12 h-12 rounded-2xl bg-rapidlyRed/10 text-rapidlyRed group-hover:bg-rapidlyRed group-hover:text-white transition flex items-center justify-center">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/>
                            <circle cx="7" cy="17" r="2" stroke-width="2"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17h6"/>
                            <circle cx="17" cy="17" r="2" stroke-width="2"/>
                        </svg>
                    </div>
                    <span class="text-xs font-bold text-gray-900">Ville</span>
                    <span class="text-[9px] text-gray-500 font-semibold -mt-1">VTC Négocié</span>
                </div>

                <!-- Livraison (Colis Moto) -->
                <div onclick="openOrderModal('livraison')" class="bg-gray-50 border border-gray-200 hover:border-amber-500/40 p-3 rounded-2xl flex flex-col items-center gap-1.5 cursor-pointer active:scale-95 transition text-center shadow-card group">
                    <div class="w-12 h-12 rounded-2xl bg-amber-500/10 text-amber-600 group-hover:bg-amber-500 group-hover:text-white transition flex items-center justify-center">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                    </div>
                    <span class="text-xs font-bold text-gray-900">Livraison</span>
                    <span class="text-[9px] text-gray-500 font-semibold -mt-1">Colis Moto</span>
                </div>

                <!-- Régions (Interurbain) -->
                <div onclick="openOrderModal('regions')" class="bg-gray-50 border border-gray-200 hover:border-blue-500/40 p-3 rounded-2xl flex flex-col items-center gap-1.5 cursor-pointer active:scale-95 transition text-center shadow-card group">
                    <div class="w-12 h-12 rounded-2xl bg-blue-500/10 text-blue-600 group-hover:bg-blue-500 group-hover:text-white transition flex items-center justify-center">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                    </div>
                    <span class="text-xs font-bold text-gray-900">Régions</span>
                    <span class="text-[9px] text-gray-500 font-semibold -mt-1">Interurbain</span>
                </div>

                <!-- Fret (Camion) -->
                <div onclick="openOrderModal('fret')" class="bg-gray-50 border border-gray-200 hover:border-purple-500/40 p-3 rounded-2xl flex flex-col items-center gap-1.5 cursor-pointer active:scale-95 transition text-center shadow-card group">
                    <div class="w-12 h-12 rounded-2xl bg-purple-500/10 text-purple-60
